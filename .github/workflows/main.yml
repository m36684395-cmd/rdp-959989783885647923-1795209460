name: RDP
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Configure RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service TermService -Force -ErrorAction SilentlyContinue
      - name: Create User
        run: |
          $c=@{U=[char[]](65..90);L=[char[]](97..122);N=[char[]](48..57);S=([char[]](33..47)+[char[]](58..64)+[char[]](91..96)+[char[]](123..126))}
          $raw=@();$raw+=$c.U|Get-Random -Count 4;$raw+=$c.L|Get-Random -Count 4;$raw+=$c.N|Get-Random -Count 4;$raw+=$c.S|Get-Random -Count 4
          $pw=-join($raw|Sort-Object{Get-Random});$sp=ConvertTo-SecureString $pw -AsPlainText -Force
          New-LocalUser -Name "Skyro" -Password $sp -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "Skyro"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Skyro"
          echo "RDP_PASSWORD=$pw" >> $env:GITHUB_ENV
      - name: Install Tailscale
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile "$env:TEMP\ts.msi"
          Start-Process msiexec -ArgumentList "/i","`"$env:TEMP\ts.msi`"","/quiet","/norestart" -Wait
      - name: Connect Tailscale
        run: |
          $hn="gh-$env:GITHUB_RUN_ID"
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=$hn --unattended
          $ip=$null;$i=0
          while(-not $ip -and $i -lt 10){$ip=& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4;Start-Sleep 5;$i++}
          if(-not $ip){exit 1}; echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
      - name: Verify
        run: |
          if(-not (Test-NetConnection $env:TAILSCALE_IP -Port 3389).TcpTestSucceeded){exit 1}
      - name: Write creds
        run: |
          @"
          HOSTNAME=gh-$env:GITHUB_RUN_ID
          IP=$env:TAILSCALE_IP
          USER=Skyro
          PASS=$env:RDP_PASSWORD
          "@ | Out-File rdp_info.txt -Encoding utf8
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with: { name: rdp-info, path: rdp_info.txt, retention-days: 1 }
      - name: Keep alive
        run: while($true){Write-Host alive;Start-Sleep 300}
